<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>川渝城市群家乡连线地图</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0b1120; }
        #chart-container { width: 100vw; height: 100vh; }

        #qrcode-container {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(16, 27, 59, 0.9);
            border: 1px solid #1785BF;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(23, 133, 191, 0.4);
            z-index: 999;
            text-align: center;
        }
        #qrcode-container p {
            color: #4DEFFF;
            margin: 0 0 10px 0;
            font-size: 14px;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #qrcode img {
            padding: 5px;
            background: white;
            border-radius: 4px;
        }

        #controls-container {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(16, 27, 59, 0.95);
            border: 1px solid #1785BF;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(23, 133, 191, 0.4);
            z-index: 999;
            width: 280px;
        }
        #controls-container h3 {
            color: #fff;
            margin: 0 0 15px 0;
            font-size: 16px;
            font-family: "Microsoft YaHei", sans-serif;
            border-bottom: 1px solid #1E88E5;
            padding-bottom: 10px;
        }
        .control-group { margin-bottom: 15px; }
        select {
            width: 100%;
            padding: 10px;
            background: #0b1120;
            color: #4DEFFF;
            border: 1px solid #1785BF;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }
        .btn-add {
            background: linear-gradient(90deg, #1890ff, #096dd9);
            box-shadow: 0 2px 10px rgba(24, 144, 255, 0.3);
        }
        .btn-clear {
            background: linear-gradient(90deg, #ff4d4f, #cf1322);
            box-shadow: 0 2px 10px rgba(255, 77, 79, 0.3);
        }

        #loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #4DEFFF;
            font-size: 20px;
            font-family: sans-serif;
            z-index: 1000;
        }

        #status-box {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: #d9f7ff;
            background: rgba(24, 144, 255, 0.12);
            border: 1px solid rgba(24, 144, 255, 0.35);
            word-break: break-all;
        }
        #status-box.error {
            color: #fff1f0;
            background: rgba(255, 77, 79, 0.12);
            border-color: rgba(255, 77, 79, 0.35);
        }
        #status-box.success {
            color: #f6ffed;
            background: rgba(82, 196, 26, 0.12);
            border-color: rgba(82, 196, 26, 0.35);
        }
    </style>

    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div id="loading">正在加载川渝地图数据...</div>

    <div id="chart-container"></div>

    <div id="controls-container">
        <h3>控制台</h3>

        <div class="control-group">
            <select id="pcCitySelect">
                <option value="">-- 选择起点城市 --</option>
            </select>
        </div>

        <div class="control-group">
            <select id="pcDestinationSelect">
                <option value="">-- 选择终点城市 --</option>
            </select>
        </div>

        <div class="control-group">
            <select id="pcWeightSelect">
                <option value="1">-- 选择通行次数 (默认为1) --</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>

        <div class="btn-row">
            <button class="btn-add" onclick="manualAddLine()">生成连线</button>
            <button class="btn-clear" onclick="clearAllLines()">清除连线</button>
        </div>

        <div id="status-box">状态：等待初始化...</div>
    </div>

    <div id="qrcode-container">
        <p>手机扫码互动</p>
        <div id="qrcode"></div>
    </div>

    <script>
        const cityCoords = {
            "重庆市": [106.550464, 29.563009], "渝中区": [106.587254, 29.554681], "大渡口区": [106.498954, 29.532517],
            "江北区": [106.568652, 29.582741], "沙坪坝区": [106.442734, 29.579036], "九龙坡区": [106.468845, 29.513925],
            "南岸区": [106.597446, 29.504003], "北碚区": [106.334113, 29.813385], "渝北区": [106.648904, 29.626314],
            "巴南区": [106.517436, 29.417875], "万州区": [108.353036, 30.835791], "涪陵区": [107.388987, 29.705898],
            "黔江区": [108.875878, 29.516586], "长寿区": [106.977171, 29.866618], "江津区": [106.25, 29.28],
            "合川区": [106.26, 30.04], "永川区": [105.90, 29.35], "南川区": [107.09, 29.17], "綦江区": [106.67, 29.17],
            "大足区": [105.71, 29.82], "璧山区": [106.27, 29.59], "铜梁区": [106.06, 30.08], "潼南区": [105.85, 30.22],
            "荣昌区": [105.59, 29.40], "开州区": [108.3800, 31.1890], "梁平区": [107.82, 30.63], "武隆区": [107.76, 29.35],
            "城口县": [108.72, 31.95], "丰都县": [107.73, 29.87], "垫江县": [107.34, 30.31], "忠县": [108.03, 30.28],
            "云阳县": [108.70, 30.91], "奉节县": [109.47, 31.02], "巫山县": [109.87, 31.07], "巫溪县": [109.64, 31.43],
            "石柱土家族自治县": [108.06, 30.04], "秀山土家族苗族自治县": [108.99, 28.47], "酉阳土家族苗族自治县": [108.76, 28.84],
            "彭水苗族土家族自治县": [108.16, 29.28],

            "成都市": [104.065735, 30.659462], "绵阳市": [104.755164, 31.474372], "德阳市": [104.386120, 31.131889],
            "宜宾市": [104.635578, 28.760958], "泸州市": [105.386194, 28.881175], "乐山市": [103.760285, 29.594672],
            "南充市": [106.082530, 30.836056], "达州市": [107.501748, 31.202922], "自贡市": [104.773416, 29.344625],
            "攀枝花市": [101.717737, 26.582510], "广元市": [105.836910, 32.447577], "遂宁市": [105.589199, 30.504735],
            "内江市": [105.059389, 29.594176], "眉山市": [103.863916, 30.049309], "广安市": [106.633259, 30.482867],
            "雅安市": [103.005206, 30.082139], "资阳市": [104.668610, 30.124518], "巴中市": [106.759111, 31.860926],
            "凉山彝族自治州": [102.269390, 27.921766], "阿坝藏族羌族自治州": [103.0905, 31.9009], "甘孜藏族自治州": [101.9566, 30.0410]
        };

        let lineData = [];
        let chart = null;
        let db = null;

        const statusBox = document.getElementById("status-box");

        function setStatus(message, type = "") {
            statusBox.className = "";
            if (type) {
                statusBox.classList.add(type);
            }
            statusBox.textContent = "状态：" + message;
        }

        const allCityPoints = Object.keys(cityCoords).map(name => ({
            name: name,
            value: [...cityCoords[name]]
        }));

        const cityNames = Object.keys(cityCoords);
        cityNames.sort((a, b) => a.localeCompare(b, 'zh-CN'));
        cityNames.forEach(city => {
            const opt1 = document.createElement("option");
            opt1.value = city;
            opt1.text = city;
            document.getElementById("pcCitySelect").appendChild(opt1);

            const opt2 = document.createElement("option");
            opt2.value = city;
            opt2.text = city;
            document.getElementById("pcDestinationSelect").appendChild(opt2);
        });

        const firebaseConfig = {
            apiKey: "AIzaSyC8ShQbPovscKxEH-uN7HkCBbKAN514u5Q",
            authDomain: "maptest-7cc7d.firebaseapp.com",
            databaseURL: "https://maptest-7cc7d-default-rtdb.firebaseio.com",
            projectId: "maptest-7cc7d",
            storageBucket: "maptest-7cc7d.firebasestorage.app",
            messagingSenderId: "420772513972",
            appId: "1:420772513972:web:76fb5ce8e19b82be66afe1"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            setStatus("Firebase 初始化成功，正在检测数据库连接...");
        } catch (e) {
            console.error("Firebase 初始化失败：", e);
            setStatus("Firebase 初始化失败：" + e.message, "error");
        }

        function testFirebaseConnection() {
            if (!db) return;

            db.ref(".info/connected").on("value", function(snapshot) {
                const connected = snapshot.val();
                if (connected === true) {
                    setStatus("已连接 Firebase，等待数据同步...", "success");
                } else {
                    setStatus("未连接到 Firebase，请检查数据库配置或网络。", "error");
                }
            });
        }

        function getLineColorHash(cityA, cityB) {
            const key = cityA < cityB ? `${cityA}-${cityB}` : `${cityB}-${cityA}`;
            let hash = 0;
            for (let i = 0; i < key.length; i++) {
                hash = key.charCodeAt(i) + ((hash << 5) - hash);
            }
            const maxColor = 220;
            const minColor = 80;
            const r = Math.min(maxColor, Math.max(minColor, (hash >> 16) & 0xFF));
            const g = Math.min(maxColor, Math.max(minColor, (hash >> 8) & 0xFF));
            const b = Math.min(maxColor, Math.max(minColor, hash & 0xFF));
            return '#' + r.toString(16).padStart(2, '0') +
                   g.toString(16).padStart(2, '0') +
                   b.toString(16).padStart(2, '0');
        }

        function getLineStyle(cityA, cityB, weight) {
            const baseColor = getLineColorHash(cityA, cityB);
            const maxShadow = 20;
            const lineWidth = 1.2 + (weight * 0.25);
            const shadowBlur = Math.min(maxShadow, weight * 1.8);

            return {
                color: baseColor,
                lineWidth: lineWidth,
                shadowBlur: shadowBlur
            };
        }

        chart = echarts.init(document.getElementById('chart-container'));

        const textureImg = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAL0lEQVQIW2NkQAJ/Gf5vBAmwMYAAmAATEBPG///+/zcD8xn+//8PUgRTAzYAzCwA+2sXc9/j52QAAAAASUVORK5CYII=';
        const getTextureImage = () => {
            const img = new Image();
            img.src = textureImg;
            return img;
        };

        Promise.all([
            fetch('./sichuan.json').then(r => {
                if (!r.ok) throw new Error('sichuan.json 加载失败');
                return r.json();
            }),
            fetch('./chongqing.json').then(r => {
                if (!r.ok) throw new Error('chongqing.json 加载失败');
                return r.json();
            })
        ]).then(([sichuanJson, chongqingJson]) => {
            const combinedFeatures = [...sichuanJson.features, ...chongqingJson.features];
            const combinedJson = { type: "FeatureCollection", features: combinedFeatures };
            echarts.registerMap('chuanyu', combinedJson);

            document.getElementById('loading').style.display = 'none';

            const option = {
                backgroundColor: '#0b1120',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.seriesType === 'lines') {
                            const data = params.data;
                            return `
                                路线: <strong>${data.fromName}</strong> ${data.isSolid ? '→ (直达)' : '⇢ (返程/冲突)'} <strong>${data.toName}</strong><br>
                                权重: <strong>${data.weight}</strong>
                            `;
                        }
                        if (params.seriesType === 'effectScatter') {
                            return `城市: <strong>${params.name}</strong>`;
                        }
                        return '';
                    }
                },
                geo: {
                    map: 'chuanyu',
                    roam: true,
                    label: { show: false },
                    itemStyle: {
                        areaColor: { image: getTextureImage(), repeat: 'repeat' },
                        borderColor: '#1E88E5',
                        borderWidth: 1,
                        shadowColor: 'rgba(0, 0, 0, 0.5)',
                        shadowBlur: 10,
                        shadowOffsetY: 5
                    },
                    emphasis: {
                        areaColor: '#1785BF',
                        label: { show: false }
                    }
                },
                series: [
                    { type: 'map', map: 'chuanyu', geoIndex: 0, label: { show: false }, select: { disabled: true } },
                    { type: 'scatter', coordinateSystem: 'geo', zlevel: 5, data: allCityPoints, itemStyle: { color: 'rgba(255, 255, 255, 0.4)' } },
                    {
                        type: 'lines',
                        zlevel: 3,
                        effect: {
                            show: true,
                            period: 4,
                            trailLength: 0.4,
                            symbol: 'arrow',
                            symbolSize: 8
                        },
                        lineStyle: {
                            normal: { curveness: 0.2 }
                        },
                        data: []
                    },
                    {
                        type: 'lines',
                        zlevel: 3,
                        effect: {
                            show: true,
                            period: 4,
                            trailLength: 0.4,
                            symbol: 'circle',
                            symbolSize: 4
                        },
                        lineStyle: {
                            normal: { curveness: 0.2 }
                        },
                        data: []
                    },
                    {
                        type: 'lines',
                        zlevel: 4,
                        effect: {
                            show: true,
                            period: 4,
                            trailLength: 0.1,
                            symbol: 'circle',
                            symbolSize: 3
                        },
                        lineStyle: {
                            normal: { width: 0, curveness: 0.2 }
                        },
                        data: []
                    },
                    {
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        zlevel: 6,
                        rippleEffect: { brushType: 'stroke', scale: 3 },
                        label: {
                            show: true,
                            formatter: '{b}',
                            position: 'right',
                            color: '#FFD700',
                            fontSize: 14,
                            fontWeight: 'bold',
                            textBorderColor: '#0b1120',
                            textBorderWidth: 4
                        },
                        itemStyle: {
                            color: '#4DEFFF',
                            shadowBlur: 10,
                            shadowColor: '#fff'
                        },
                        data: []
                    }
                ]
            };

            chart.setOption(option);

            testFirebaseConnection();
            startListening();
        }).catch(err => {
            console.error(err);
            document.getElementById('loading').innerText = "地图加载失败，请检查 sichuan.json / chongqing.json 文件";
            setStatus("地图资源加载失败：" + err.message, "error");
        });

        function updateChart() {
            const activePointsSet = new Set();
            lineData.forEach(item => {
                activePointsSet.add(item.origin);
                activePointsSet.add(item.destination);
            });

            const activePoints = Array.from(activePointsSet).map(name => ({
                name: name,
                value: cityCoords[name] ? [...cityCoords[name], 1] : undefined
            })).filter(point => point.value);

            const solidLineData = [];
            const dashedLineData = [];
            const allParticlesData = [];

            lineData.forEach(item => {
                const isSolid = item.isSolid;
                const style = getLineStyle(item.origin, item.destination, item.weight);

                const lineObject = {
                    name: `${item.origin} → ${item.destination}`,
                    fromName: item.origin,
                    toName: item.destination,
                    weight: item.weight,
                    isSolid: isSolid,
                    coords: item.coords,
                    lineStyle: {
                        normal: {
                            color: style.color,
                            width: style.lineWidth,
                            shadowBlur: style.shadowBlur,
                            shadowColor: style.color,
                            opacity: isSolid ? 0.8 : 0.4,
                            curveness: 0.2,
                            type: isSolid ? 'solid' : 'dashed'
                        }
                    },
                    effect: { color: style.color }
                };

                if (isSolid) {
                    solidLineData.push(lineObject);
                    allParticlesData.push({
                        coords: item.coords,
                        effect: { color: style.color }
                    });
                } else {
                    dashedLineData.push(lineObject);
                    allParticlesData.push({
                        coords: item.coords,
                        effect: { color: style.color, symbol: 'circle', symbolSize: 3 }
                    });
                }
            });

            chart.setOption({
                series: [
                    {},
                    {},
                    { data: solidLineData },
                    { data: dashedLineData },
                    { data: allParticlesData },
                    { data: activePoints }
                ]
            });
        }

        function startListening() {
            if (!db) return;

            db.ref("hometownSubmissions").on("value", function(snapshot) {
                lineData = [];
                const rawSubmissions = {};

                snapshot.forEach(childSnapshot => {
                    const data = childSnapshot.val();
                    const origin = data.origin;
                    const dest = data.destination;
                    const weight = data.weight || 1;

                    if (cityCoords[origin] && cityCoords[dest] && origin !== dest) {
                        const key = `${origin}->${dest}`;
                        if (!rawSubmissions[key]) {
                            rawSubmissions[key] = {
                                origin: origin,
                                destination: dest,
                                weightSum: 0
                            };
                        }
                        rawSubmissions[key].weightSum += weight;
                    }
                });

                for (const key in rawSubmissions) {
                    const item = rawSubmissions[key];
                    const origin = item.origin;
                    const dest = item.destination;
                    const reverseKey = `${dest}->${origin}`;

                    let isSolid = true;

                    if (rawSubmissions[reverseKey]) {
                        if (origin.localeCompare(dest, 'zh-CN') > 0) {
                            isSolid = false;
                        }
                    }

                    lineData.push({
                        origin: origin,
                        destination: dest,
                        weight: item.weightSum,
                        coords: [cityCoords[origin], cityCoords[dest]],
                        isSolid: isSolid
                    });
                }

                updateChart();
                setStatus(`数据同步成功，当前共有 ${lineData.length} 条聚合连线。`, "success");
            }, function(error) {
                console.error("监听数据库失败：", error);
                setStatus("监听数据库失败：" + error.message, "error");
            });
        }

        function manualAddLine() {
            if (!db) {
                alert("Firebase 未初始化成功");
                return;
            }

            const origin = document.getElementById("pcCitySelect").value;
            const destination = document.getElementById("pcDestinationSelect").value;
            const weight = document.getElementById("pcWeightSelect").value;

            if (!origin || !destination) {
                alert("请选择起点和终点！");
                return;
            }
            if (origin === destination) {
                alert("起点和终点不能相同！");
                return;
            }

            setStatus("正在写入连线数据...", "");

            db.ref("hometownSubmissions").push({
                origin: origin,
                destination: destination,
                weight: parseInt(weight, 10),
                source: "PC_Manual",
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                console.log("PC 写入成功");
                setStatus(`写入成功：${origin} → ${destination}`, "success");
                alert("生成成功！");
            }).catch(err => {
                console.error("PC 写入失败：", err);
                setStatus("写入失败：" + err.message, "error");
                alert("生成失败：" + err.message);
            });
        }

        function clearAllLines() {
            if (!db) {
                alert("Firebase 未初始化成功");
                return;
            }

            if (!confirm("确定要清除屏幕上所有连线吗？这将同时清空云端历史数据。")) return;

            setStatus("正在清除云端数据...", "");

            db.ref("hometownSubmissions").remove().then(() => {
                lineData = [];
                chart.setOption({
                    series: [{}, {}, { data: [] }, { data: [] }, { data: [] }, { data: [] }]
                });
                setStatus("已清除所有连线数据。", "success");
                alert("清除成功！");
            }).catch(err => {
                console.error("清除失败：", err);
                setStatus("清除失败：" + err.message, "error");
                alert("清除失败：" + err.message);
            });
        }

        const phonePageUrl = "https://liqing010718-star.github.io/ChuanyuMap/phone.html";
        new QRCode(document.getElementById("qrcode"), {
            text: phonePageUrl,
            width: 120,
            height: 120,
            colorDark: "#000000",
            colorLight: "#ffffff"
        });

        window.addEventListener('resize', () => {
            if (chart) chart.resize();
        });
    </script>
</body>
</html>

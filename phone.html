<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点亮川渝</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px; 
            margin: 0; 
            background: linear-gradient(135deg, #0b1120 0%, #1785BF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 { 
            color: #101B3B; 
            font-size: 24px; 
            margin: 0 0 25px 0; 
            font-weight: 800;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: #1785BF; 
            font-weight: 700; 
        }
        
        select { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #e0e0e0; 
            border-radius: 12px; 
            font-size: 16px; 
            outline: none;
            background-color: #f9f9f9;
            box-sizing: border-box; 
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        select:focus { 
            border-color: #1785BF; 
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(23, 133, 191, 0.1);
        }
        
        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(90deg, #1785BF, #096dd9); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: 600;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(23, 133, 191, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:active { transform: scale(0.96); }

        button:disabled { 
            background: #ccc; 
            box-shadow: none; 
            cursor: not-allowed; 
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }

        .status {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
            background: #f5f5f5;
            color: #555;
            word-break: break-word;
        }

        .status.success {
            background: #f6ffed;
            color: #389e0d;
            border: 1px solid #b7eb8f;
        }

        .status.error {
            background: #fff2f0;
            color: #cf1322;
            border: 1px solid #ffccc7;
        }

        .status.info {
            background: #e6f7ff;
            color: #096dd9;
            border: 1px solid #91d5ff;
        }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>🚀 点亮川渝连线</h1>
        <p class="subtitle">在下方选择您的家乡与目的地<br>大屏幕将实时展示您的轨迹</p>
        
        <div class="form-group">
            <label for="originSelect">🚩 起点城市</label>
            <select id="originSelect" required>
                <option value="">点击选择起点...</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="destinationSelect">🏁 终点城市</label>
            <select id="destinationSelect" required>
                <option value="">点击选择终点...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="weightSelect">✨ 通行次数</label>
            <select id="weightSelect" required>
                <option value="1" selected>1（默认）</option>
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="7">7</option>
                <option value="10">10</option>
            </select>
        </div>

        <button onclick="submitHometown()" id="submitBtn">发射信号</button>
        <div id="status" class="status info">状态：正在初始化 Firebase...</div>
        <div class="footer">数据实时同步至大屏 · Power by ECharts</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC8ShQbPovscKxEH-uN7HkCBbKAN514u5Q",
            authDomain: "maptest-7cc7d.firebaseapp.com",
            databaseURL: "https://maptest-7cc7d-default-rtdb.firebaseio.com",
            projectId: "maptest-7cc7d",
            storageBucket: "maptest-7cc7d.firebasestorage.app",
            messagingSenderId: "420772513972",
            appId: "1:420772513972:web:76fb5ce8e19b82be66afe1"
        };

        let db = null;

        const statusEl = document.getElementById("status");

        function setStatus(message, type = "info") {
            statusEl.className = "status " + type;
            statusEl.textContent = "状态：" + message;
        }

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            setStatus("Firebase 初始化成功，正在检测数据库连接...", "info");
        } catch (e) {
            console.error("Firebase 初始化失败：", e);
            setStatus("Firebase 初始化失败：" + e.message, "error");
        }

        function testFirebaseConnection() {
            if (!db) return;

            db.ref(".info/connected").on("value", function(snapshot) {
                const connected = snapshot.val();
                if (connected === true) {
                    setStatus("已连接到 Firebase，可以发射信号。", "success");
                } else {
                    setStatus("未连接到 Firebase，请检查网络或数据库配置。", "error");
                }
            });
        }

        const cities = [
            "重庆市", "渝中区", "大渡口区", "江北区", "沙坪坝区", "九龙坡区", "南岸区", "北碚区", "渝北区", "巴南区", 
            "万州区", "涪陵区", "黔江区", "长寿区", "江津区", "合川区", "永川区", "南川区", "綦江区", "大足区", 
            "璧山区", "铜梁区", "潼南区", "荣昌区", "开州区", "梁平区", "武隆区", "城口县", "丰都县", "垫江县", 
            "忠县", "云阳县", "奉节县", "巫山县", "巫溪县", "石柱土家族自治县", "秀山土家族苗族自治县", "酉阳土家族苗族自治县", "彭水苗族土家族自治县",

            "成都市", "绵阳市", "德阳市", "宜宾市", "泸州市", "乐山市", "南充市", "达州市", "自贡市", "攀枝花市", 
            "广元市", "遂宁市", "内江市", "眉山市", "广安市", "雅安市", "资阳市", "巴中市", "凉山彝族自治州", 
            "阿坝藏族羌族自治州", "甘孜藏族自治州"
        ];

        cities.sort((a, b) => a.localeCompare(b, 'zh-CN'));

        const originSelect = document.getElementById("originSelect");
        const destinationSelect = document.getElementById("destinationSelect");

        cities.forEach(name => {
            const opt1 = document.createElement("option");
            opt1.value = name;
            opt1.text = name;
            originSelect.add(opt1);

            const opt2 = document.createElement("option");
            opt2.value = name;
            opt2.text = name;
            destinationSelect.add(opt2);
        });

        testFirebaseConnection();

        function submitHometown() {
            if (!db) {
                alert("Firebase 未初始化成功");
                setStatus("Firebase 未初始化成功，无法提交。", "error");
                return;
            }

            const origin = originSelect.value.trim();
            const destination = destinationSelect.value.trim();
            const weight = document.getElementById("weightSelect").value;
            
            if (!origin || !destination) {
                alert("请确保【起点】和【终点】都已选择！");
                return;
            }

            if (origin === destination) {
                alert("起点和终点不能是同一个城市哦~");
                return;
            }

            const btn = document.getElementById("submitBtn");
            const originalText = btn.innerText;

            btn.disabled = true;
            btn.innerText = "🚀 信号传输中...";
            setStatus("正在向云端提交数据...", "info");

            db.ref("hometownSubmissions").push({
                origin: origin,
                destination: destination,
                weight: parseInt(weight, 10),
                source: "Mobile_User",
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                btn.style.background = "linear-gradient(90deg, #52c41a, #389e0d)";
                btn.innerText = "✅ 发射成功！请看大屏";
                setStatus(`提交成功：${origin} → ${destination}`, "success");

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    btn.style.background = "";
                }, 2000);
            }).catch(err => {
                console.error("Mobile 写入失败：", err);
                alert("提交失败：" + err.message);
                setStatus("提交失败：" + err.message, "error");
                btn.disabled = false;
                btn.innerText = originalText;
                btn.style.background = "";
            });
        }
    </script>
</body>
</html>
